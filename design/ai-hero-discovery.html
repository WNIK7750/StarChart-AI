<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发现AI · Hero Demo</title>
<link rel="icon" type="image/png" href="../assets/logo.png">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root {
  --bg-primary: #030817;
  --bg-secondary: #07142f;
  --surface: rgba(10, 18, 48, 0.72);
  --surface-strong: rgba(12, 21, 56, 0.9);
  --text-primary: #f7f8ff;
  --text-secondary: #949dbb;
  --text-tertiary: #707995;
  --purple: #8b5cf6;
  --purple-light: #b65cff;
  --magenta: #dc63dd;
  --blue: #4f72ff;
  --cyan: #27c2ff;
  --border-purple: rgba(174, 112, 255, 0.42);
  --border-blue: rgba(74, 155, 255, 0.42);
  --shadow-purple: rgba(138, 77, 255, 0.28);
  --shadow-blue: rgba(30, 137, 255, 0.24);
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 26px;
  --content-width: 1380px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100svh;
  overflow-x: hidden;
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text-primary);
  background: linear-gradient(180deg, #020716 0%, #07132e 100%);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }
button { border: 0; color: inherit; cursor: pointer; }
img, svg { display: block; }
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
:focus-visible {
  outline: 2px solid rgba(39, 194, 255, .9);
  outline-offset: 4px;
}

.site-background {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  background:
    radial-gradient(circle at 17% 78%, rgba(139, 92, 246, .2), transparent 24%),
    radial-gradient(circle at 80% 36%, rgba(39, 194, 255, .16), transparent 28%),
    linear-gradient(180deg, var(--bg-primary), var(--bg-secondary));
}
.site-background::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .035;
  background: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 6px);
  pointer-events: none;
}
.site-background::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .42;
  background-image:
    radial-gradient(circle, rgba(255, 255, 180, .72) 0 1px, transparent 1.8px),
    radial-gradient(circle, rgba(130, 170, 255, .48) 0 1px, transparent 1.6px);
  background-size: 170px 140px, 230px 190px;
  background-position: 20px 12px, 80px 60px;
  animation: star-drift 22s linear infinite;
}
.ambient-orb {
  position: absolute;
  width: 360px;
  height: 360px;
  border-radius: 999px;
  filter: blur(72px);
  opacity: .58;
  transform: translate3d(0, 0, 0);
  pointer-events: none;
}
.ambient-orb--purple { left: 7%; bottom: 6%; background: rgba(139, 92, 246, .36); }
.ambient-orb--blue { right: 9%; top: 23%; background: rgba(39, 194, 255, .24); }

.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  transition: background .25s ease, border-color .25s ease, backdrop-filter .25s ease;
}
.site-header.is-scrolled {
  backdrop-filter: blur(18px);
  background: rgba(3, 8, 23, 0.72);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.site-header__inner {
  width: min(100% - 64px, var(--content-width));
  height: 72px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 780;
}
.brand__mark {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: #fff;
  font-weight: 850;
  background: linear-gradient(135deg, var(--cyan), var(--blue) 55%, var(--purple));
  box-shadow: 0 16px 34px rgba(79, 114, 255, .22);
}
.brand__name { letter-spacing: -.02em; }
.brand__beta {
  padding: 4px 8px;
  border-radius: 999px;
  color: #bcd0ff;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.08);
  font-size: 11px;
  font-weight: 760;
}
.nav {
  display: flex;
  align-items: center;
  gap: 26px;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 650;
}
.nav__link {
  position: relative;
  padding: 24px 0;
  transition: color .2s ease;
}
.nav__link::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 15px;
  width: 20px;
  height: 2px;
  border-radius: 99px;
  opacity: 0;
  transform: translateX(-50%) scaleX(.5);
  background: linear-gradient(90deg, var(--purple-light), var(--cyan));
  transition: opacity .2s ease, transform .2s ease;
}
.nav__link:hover, .nav__link:focus-visible { color: #fff; }
.nav__link:hover::after, .nav__link:focus-visible::after { opacity: 1; transform: translateX(-50%) scaleX(1); }
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 760;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.btn--ghost {
  background: rgba(2, 7, 22, .35);
  border: 1px solid rgba(255,255,255,.1);
  color: var(--text-primary);
}
.btn--primary {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  box-shadow: 0 14px 34px rgba(79, 114, 255, .24);
}
.btn--primary:hover { transform: translateY(-1px); box-shadow: 0 18px 42px rgba(79, 114, 255, .34); }
.menu-button {
  display: none;
  width: 42px;
  height: 42px;
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.1);
}

.hero {
  position: relative;
  min-height: 100svh;
  padding: 74px 32px 58px;
  overflow: hidden;
}
.hero__inner {
  position: relative;
  z-index: 2;
  width: min(100%, var(--content-width));
  margin: 0 auto;
  text-align: center;
}
.hero-network {
  position: absolute;
  inset: 78px 0 auto;
  height: 360px;
  z-index: 1;
  pointer-events: none;
  opacity: .9;
}
.hero-network svg {
  width: min(100%, 1300px);
  height: 100%;
  margin: 0 auto;
}
.network-line {
  fill: none;
  stroke-width: 1;
  stroke-linecap: round;
  opacity: .32;
}
.network-line--purple { stroke: rgba(182, 92, 255, .58); }
.network-line--blue { stroke: rgba(39, 194, 255, .52); }
.network-node {
  fill: rgba(247, 248, 255, .82);
  filter: drop-shadow(0 0 10px rgba(79,114,255,.55));
}
.network-pulse {
  fill: rgba(39, 194, 255, .8);
  opacity: .48;
}
.network-pulse--two { fill: rgba(182, 92, 255, .82); animation-delay: -2.4s; }

.hero-copy {
  position: relative;
  z-index: 3;
  max-width: 980px;
  margin: 0 auto;
}
.hero-title {
  margin: 0;
  display: grid;
  gap: 4px;
  line-height: 1.05;
  letter-spacing: -.035em;
  font-weight: 820;
}
.hero-title__accent {
  display: block;
  font-size: clamp(46px, 6vw, 72px);
  background: linear-gradient(100deg, #7475ff 0%, #b762e9 48%, #e76dca 72%, #7289ff 100%);
  background-size: 180% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: title-sheen 8s ease-in-out infinite;
}
.hero-title__main {
  display: block;
  color: var(--text-primary);
  font-size: clamp(44px, 5.7vw, 68px);
}
.hero-subtitle {
  width: min(100%, 1180px);
  max-width: none;
  margin: 22px auto 0;
  color: var(--text-secondary);
  font-size: clamp(15px, 1.48vw, 20px);
  line-height: 1.75;
  white-space: nowrap;
  letter-spacing: .01em;
}

.hero-search {
  position: relative;
  width: min(100%, 1120px);
  height: 94px;
  margin: 34px auto 22px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 104px;
  align-items: center;
  gap: 18px;
  padding: 0 22px 0 30px;
  border-radius: 28px;
  background: rgba(7, 14, 39, 0.82);
  border: 1px solid rgba(255,255,255,.11);
  box-shadow: 0 22px 80px rgba(30, 137, 255, .13), 0 18px 58px rgba(138, 77, 255, .12);
  backdrop-filter: blur(20px);
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.hero-search::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: 1px;
  border-radius: inherit;
  background: linear-gradient(100deg, rgba(174,112,255,.6), rgba(39,194,255,.5));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: .72;
  pointer-events: none;
}
.hero-search:focus-within {
  transform: translateY(-2px);
  border-color: rgba(255,255,255,.2);
  box-shadow: 0 28px 92px rgba(30,137,255,.2), 0 20px 76px rgba(138,77,255,.18);
}
.hero-search__icon { color: var(--text-tertiary); transition: color .2s ease; }
.hero-search:focus-within .hero-search__icon { color: #c9b8ff; }
.hero-search input {
  width: 100%;
  height: 100%;
  border: 0;
  outline: 0;
  color: #fff;
  background: transparent;
  font-size: clamp(16px, 1.6vw, 20px);
}
.hero-search input::placeholder { color: rgba(148,157,187,.72); }
.hero-search__button {
  position: relative;
  min-width: 64px;
  height: 58px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: #fff;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  box-shadow: 0 16px 34px rgba(79,114,255,.28);
  transition: transform .16s ease, filter .16s ease;
}
.hero-search__button::before {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: inherit;
  background:
    radial-gradient(circle at 32% 24%, rgba(255,255,255,.34), transparent 26%),
    linear-gradient(135deg, rgba(255,255,255,.18), transparent 54%);
  opacity: .72;
  pointer-events: none;
}
.hero-search__button .search-icon {
  position: relative;
  z-index: 1;
  width: 28px;
  height: 28px;
  color: #fff;
  stroke: currentColor;
  stroke-width: 2.4;
  fill: none;
  filter: drop-shadow(0 5px 12px rgba(255,255,255,.22));
  transition: transform .16s ease;
}
.hero-search__button:hover .search-icon { transform: scale(1.06) rotate(-4deg); }
.hero-search__button:hover { transform: scale(1.03); filter: brightness(1.08); }
.hero-search__button:active { transform: scale(.98); }
.hero-search__button.is-loading .search-icon { display: none; }
.hero-search__button.is-loading::after {
  content: "";
  width: 22px;
  height: 22px;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 999px;
  animation: spin .7s linear infinite;
}
.hero-status {
  min-height: 22px;
  margin: -10px auto 18px;
  color: #c7d2fe;
  font-size: 14px;
}

.workflow-showcase {
  position: relative;
  width: min(100%, 1320px);
  margin: 0 auto;
  padding: 22px;
  border-radius: 28px;
  background: linear-gradient(135deg, rgba(10,18,48,.78), rgba(8,18,42,.62));
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 28px 90px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.04);
  overflow: hidden;
}
.workflow-showcase::before,
.workflow-showcase::after {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 36%;
  background: radial-gradient(circle at left center, rgba(139,92,246,.18), transparent 62%);
  pointer-events: none;
}
.workflow-showcase::after {
  left: auto;
  right: 0;
  background: radial-gradient(circle at right center, rgba(39,194,255,.14), transparent 62%);
}
.workflow-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.workflow-grid::before {
  content: "";
  position: absolute;
  z-index: 3;
  left: 18px;
  right: 18px;
  top: 56%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(118, 190, 255, .58), rgba(182, 92, 255, .36), transparent);
  box-shadow: 0 0 18px rgba(39, 194, 255, .18);
  opacity: 0;
  transform: scaleX(.42);
  pointer-events: none;
}
.workflow-showcase.is-surfacing .workflow-grid::before {
  animation: waterline-sweep 1.18s ease-out both;
}
.workflow-card {
  position: relative;
  min-height: 306px;
  display: flex;
  flex-direction: column;
  padding: 22px;
  border-radius: 24px;
  background:
    radial-gradient(280px circle at var(--pointer-x, 50%) var(--pointer-y, 0%), rgba(118, 116, 255, 0.14), transparent 55%),
    rgba(10, 18, 48, .74);
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  overflow: hidden;
  will-change: transform, opacity, filter, clip-path;
  transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
}
.workflow-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -50%;
  width: 46%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.64), transparent);
  transition: transform .3s ease;
}
.workflow-card:hover {
  transform: translateY(-6px) scale(1.01);
  border-color: rgba(174,112,255,.34);
  box-shadow: 0 22px 54px rgba(30,137,255,.12);
}
.workflow-card:hover::before { transform: translateX(330%); }
.workflow-card__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.popular-badge {
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  color: #d9ddff;
  background: rgba(139,92,246,.15);
  border: 1px solid rgba(174,112,255,.22);
  font-size: 12px;
  font-weight: 760;
}
.trend-icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  color: #91cfff;
  background: rgba(39,194,255,.09);
  border: 1px solid rgba(39,194,255,.16);
}
.workflow-card h2 {
  margin: 24px 0 8px;
  color: #fff;
  font-size: clamp(21px, 2vw, 26px);
  line-height: 1.2;
  letter-spacing: -.02em;
}
.workflow-card p {
  margin: 0;
  min-height: 48px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.tool-chain {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  padding-top: 22px;
  overflow: hidden;
}
.tool-item {
  width: 66px;
  display: grid;
  justify-items: center;
  gap: 8px;
  color: #d9def5;
  font-size: 11px;
  font-weight: 700;
  transition: transform .3s ease;
}
.tool-icon {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
}
.tool-icon img {
  width: 30px;
  height: 30px;
  object-fit: contain;
}
.chain-arrow {
  flex: 0 0 auto;
  width: 18px;
  height: 1px;
  background: linear-gradient(90deg, rgba(112,121,149,.34), rgba(112,121,149,.72));
  transition: background .3s ease, box-shadow .3s ease;
}
.workflow-card:hover .tool-item { transform: translateY(-2px); }
.workflow-card:hover .chain-arrow { background: linear-gradient(90deg, var(--purple-light), var(--cyan)); box-shadow: 0 0 12px rgba(39,194,255,.34); }
.workflow-card__action {
  width: max-content;
  min-height: 40px;
  margin-top: 18px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border-radius: 999px;
  color: #eef2ff;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  font-size: 14px;
  font-weight: 760;
}

@keyframes title-sheen {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@keyframes star-drift { to { background-position: 190px 152px, 310px 250px; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes waterline-sweep {
  0% { opacity: 0; transform: scaleX(.36) translateY(18px); }
  34% { opacity: .74; transform: scaleX(.88) translateY(0); }
  100% { opacity: 0; transform: scaleX(1) translateY(-18px); }
}
.is-shaking { animation: shake .34s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  70% { transform: translateX(7px); }
}

@media (max-width: 1199px) {
  .site-header__inner { width: min(100% - 40px, var(--content-width)); }
  .nav { gap: 16px; }
  .workflow-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .workflow-card:last-child { grid-column: 1 / -1; }
  .hero-search { height: 82px; }
}
@media (max-width: 767px) {
  .site-header__inner { width: min(100% - 32px, var(--content-width)); height: 66px; }
  .nav {
    position: absolute;
    top: 66px;
    left: 16px;
    right: 16px;
    display: none;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 12px;
    border-radius: 20px;
    background: rgba(3, 8, 23, .94);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
  }
  .nav.is-open { display: flex; }
  .nav__link { padding: 12px; }
  .nav__link::after { display: none; }
  .header-actions .btn--ghost { display: none; }
  .menu-button { display: grid; place-items: center; }
  .hero { padding: 104px 16px 42px; }
  .hero-title { gap: 2px; }
  .hero-title__accent { font-size: clamp(39px, 13vw, 56px); }
  .hero-title__main { font-size: clamp(39px, 12vw, 54px); }
  .hero-network { opacity: .42; }
  .hero-search {
    height: 68px;
    grid-template-columns: auto minmax(0, 1fr) 64px;
    gap: 10px;
    padding: 0 8px 0 16px;
    border-radius: 22px;
  }
  .hero-search__button { height: 52px; border-radius: 17px; }
  .workflow-showcase { padding: 14px; }
  .workflow-grid {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .workflow-grid::-webkit-scrollbar { display: none; }
  .workflow-card { flex: 0 0 88%; scroll-snap-align: center; min-height: 304px; }
  .tool-item { width: 52px; font-size: 10px; }
  .tool-icon { width: 44px; height: 44px; border-radius: 14px; }
  .tool-icon img { width: 26px; height: 26px; }
  .chain-arrow { width: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<div class="site-background" aria-hidden="true">
  <div class="ambient-orb ambient-orb--purple"></div>
  <div class="ambient-orb ambient-orb--blue"></div>
</div>

<main>
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-network" aria-hidden="true">
      <svg viewBox="0 0 1300 360" preserveAspectRatio="xMidYMid meet">
        <path id="path-a" class="network-line network-line--purple" d="M115 244 C 260 104, 418 92, 560 176 S 830 260, 1050 120"/>
        <path id="path-b" class="network-line network-line--blue" d="M220 104 C 370 220, 510 230, 650 136 S 900 52, 1120 230"/>
        <path class="network-line network-line--purple" d="M110 164 C 280 176, 390 56, 540 110 S 790 194, 1030 92"/>
        <path class="network-line network-line--blue" d="M280 286 C 460 210, 610 250, 720 178 S 920 126, 1160 174"/>
        <path class="network-line network-line--purple" d="M370 70 C 540 84, 690 48, 850 86 S 1060 160, 1210 86"/>
        <circle class="network-node" cx="226" cy="104" r="4"/>
        <circle class="network-node" cx="420" cy="92" r="4"/>
        <circle class="network-node" cx="650" cy="136" r="5"/>
        <circle class="network-node" cx="850" cy="86" r="4"/>
        <circle class="network-node" cx="1030" cy="92" r="4"/>
        <circle class="network-node" cx="1120" cy="230" r="5"/>
        <circle class="network-pulse" r="4">
          <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#path-a"/></animateMotion>
        </circle>
        <circle class="network-pulse network-pulse--two" r="3.5">
          <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#path-b"/></animateMotion>
        </circle>
      </svg>
    </div>

    <div class="hero__inner">
      <div class="hero-copy">
        <h1 class="hero-title" id="hero-title">
          <span class="hero-title__accent">发现 AI</span>
          <span class="hero-title__main">组合你的超级工作流</span>
        </h1>
        <p class="hero-subtitle">覆盖多种工作高频场景  像工具雷达一样快速定位适合你的 AI 能力  帮助你量身定做工作流</p>
      </div>

      <form class="hero-search" role="search" data-search-form>
        <label class="visually-hidden" for="hero-search-input">搜索 AI 工具或任务</label>
        <i class="hero-search__icon" data-lucide="search"></i>
        <input id="hero-search-input" name="query" type="search" placeholder="搜索 AI 工具，例如：ChatGPT、Midjourney、NotebookLM..." autocomplete="off" data-search-input>
        <button class="hero-search__button" type="submit" aria-label="搜索" data-search-button>
          <svg class="search-icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.7"></circle>
            <path d="m16 16 4.3 4.3"></path>
          </svg>
        </button>
      </form>
      <p class="hero-status" role="status" aria-live="polite" data-search-status></p>

      <section class="workflow-showcase" aria-label="热门工作流" id="workflows">
        <div class="workflow-grid" data-workflow-grid></div>
      </section>
    </div>
  </section>
</main>

<script type="module">
const workflows = [
  {
    id: "youtube-video",
    tag: "热门组合",
    title: "YouTube 视频工作流",
    description: "从创意到成片的一站式 AI 工作流",
    accent: "purple",
    tools: [
      { name: "ChatGPT", icon: "../assets/brands/chatgpt.svg" },
      { name: "Midjourney", icon: "../assets/brands/midjourney.svg" },
      { name: "Runway", icon: "../assets/brands/runway.svg" },
      { name: "CapCut", icon: "../assets/brands/capcut.svg" }
    ]
  },
  {
    id: "paper-reading",
    tag: "热门组合",
    title: "论文阅读工作流",
    description: "高效理解、总结与创新的学术利器",
    accent: "violet",
    tools: [
      { name: "NotebookLM", icon: "../assets/brands/notebooklm.svg" },
      { name: "Perplexity", icon: "../assets/brands/perplexity.svg" },
      { name: "Claude", icon: "../assets/brands/claude.svg" }
    ]
  },
  {
    id: "code-development",
    tag: "热门组合",
    title: "代码开发工作流",
    description: "智能编程、协作与监控的全栈解决方案",
    accent: "blue",
    tools: [
      { name: "Cursor", icon: "../assets/brands/cursor.svg" },
      { name: "GitHub Copilot", icon: "../assets/brands/githubcopilot.svg" },
      { name: "Sentry", icon: "../assets/brands/sentry.svg" }
    ]
  }
];

const neutralIcon = "../assets/brands/neutral-tool.svg";
const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const qs = (selector, scope = document) => scope.querySelector(selector);
const qsa = (selector, scope = document) => Array.from(scope.querySelectorAll(selector));

function toolMarkup(tool, index, total) {
  const arrow = index < total - 1 ? '<span class="chain-arrow" aria-hidden="true"></span>' : "";
  return `
    <div class="tool-item">
      <span class="tool-icon">
        <img src="${tool.icon}" width="30" height="30" alt="${tool.name} Logo" loading="eager" data-brand-icon>
      </span>
      <span>${tool.name}</span>
    </div>
    ${arrow}
  `;
}

function renderWorkflows() {
  const grid = qs("[data-workflow-grid]");
  grid.innerHTML = workflows.map((workflow) => `
    <article class="workflow-card workflow-card--${workflow.accent}" tabindex="0" data-workflow-id="${workflow.id}">
      <div class="workflow-card__top">
        <span class="popular-badge">${workflow.tag}</span>
        <span class="trend-icon" aria-hidden="true"><i data-lucide="trending-up"></i></span>
      </div>
      <h2>${workflow.title}</h2>
      <p>${workflow.description}</p>
      <div class="tool-chain">${workflow.tools.map((tool, index) => toolMarkup(tool, index, workflow.tools.length)).join("")}</div>
      <a class="workflow-card__action" href="#${workflow.id}" data-workflow-action>查看方案 <i data-lucide="arrow-right"></i></a>
    </article>
  `).join("");

  qsa("[data-brand-icon]", grid).forEach((img) => {
    img.addEventListener("error", () => {
      img.src = neutralIcon;
      img.alt = "通用 AI 工具图标";
    }, { once: true });
  });

  qsa(".workflow-card", grid).forEach((card) => {
    card.addEventListener("click", (event) => {
      if (event.target.closest("a")) event.preventDefault();
      console.log("workflow:", card.dataset.workflowId);
    });
    card.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        console.log("workflow:", card.dataset.workflowId);
      }
    });
  });
}

function initSearch() {
  const form = qs("[data-search-form]");
  const input = qs("[data-search-input]");
  const button = qs("[data-search-button]");
  const status = qs("[data-search-status]");

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const value = input.value.trim();
    if (!value) {
      form.classList.remove("is-shaking");
      void form.offsetWidth;
      form.classList.add("is-shaking");
      status.textContent = "请输入一个任务或工具名称。";
      return;
    }
    button.classList.add("is-loading");
    button.setAttribute("aria-busy", "true");
    status.textContent = `正在为你查找相关 AI 工具：${value}`;
    console.log("search:", value);
    window.setTimeout(() => {
      button.classList.remove("is-loading");
      button.removeAttribute("aria-busy");
    }, 600);
  });
}

function initHeader() {
  const header = qs("[data-header]");
  const menuButton = qs("[data-menu-button]");
  const nav = qs("#site-nav");
  if (!header || !menuButton || !nav) return;
  const syncHeader = () => header.classList.toggle("is-scrolled", window.scrollY > 24);
  syncHeader();
  window.addEventListener("scroll", syncHeader, { passive: true });

  menuButton.addEventListener("click", () => {
    const open = menuButton.getAttribute("aria-expanded") === "true";
    menuButton.setAttribute("aria-expanded", String(!open));
    nav.classList.toggle("is-open", !open);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      menuButton.setAttribute("aria-expanded", "false");
      nav.classList.remove("is-open");
      menuButton.focus();
    }
  });
}

function initPointerEffects() {
  if (prefersReducedMotion || !window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  const purpleOrb = qs(".ambient-orb--purple");
  const blueOrb = qs(".ambient-orb--blue");
  let frame = 0;
  let targetX = 0;
  let targetY = 0;

  const move = () => {
    purpleOrb.style.transform = `translate3d(${targetX * -10}px, ${targetY * -8}px, 0)`;
    blueOrb.style.transform = `translate3d(${targetX * 14}px, ${targetY * 10}px, 0)`;
    frame = 0;
  };
  document.addEventListener("pointermove", (event) => {
    targetX = (event.clientX / window.innerWidth - .5) * 2;
    targetY = (event.clientY / window.innerHeight - .5) * 2;
    if (!frame) frame = requestAnimationFrame(move);
  }, { passive: true });
  document.addEventListener("pointerleave", () => {
    targetX = 0;
    targetY = 0;
    if (!frame) frame = requestAnimationFrame(move);
  });

  qsa(".workflow-card").forEach((card) => {
    card.addEventListener("pointermove", (event) => {
      const rect = card.getBoundingClientRect();
      card.style.setProperty("--pointer-x", `${event.clientX - rect.left}px`);
      card.style.setProperty("--pointer-y", `${event.clientY - rect.top}px`);
    });
  });
}

function initAnimations() {
  if (window.lucide) window.lucide.createIcons();
  if (prefersReducedMotion || !window.gsap) return;

  qs(".workflow-showcase")?.classList.add("is-surfacing");
  const tl = window.gsap.timeline({ defaults: { ease: "power3.out" } });
  tl.from(".site-background", { opacity: 0, duration: .32 }, 0)
    .from(".hero-title__accent", { y: 22, opacity: 0, duration: .48 }, .26)
    .from(".hero-title__main", { y: 24, opacity: 0, duration: .48 }, .38)
    .from(".hero-subtitle", { y: 16, opacity: 0, duration: .42 }, .5)
    .from(".workflow-showcase", { y: 20, opacity: 0, duration: .44 }, .72)
    .from(".workflow-card", {
      y: 88,
      opacity: 0,
      scale: .965,
      filter: "blur(10px)",
      clipPath: "inset(58% 0 0 0 round 24px)",
      duration: .72,
      stagger: .16,
      ease: "power3.out"
    }, .94);

  qsa(".network-node").forEach((node, index) => {
    window.gsap.to(node, {
      y: 3 + (index % 5),
      duration: 4 + (index % 4),
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
      delay: index * .2
    });
  });
}

renderWorkflows();
initSearch();
initHeader();
initPointerEffects();
initAnimations();
</script>
</body>
</html>
