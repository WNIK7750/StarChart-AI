name: AI Nav Non-Agent Foundation CI

on:
  pull_request:
    paths:
      - "ai-nav-fullstack/backend/**"
      - "ai-nav-fullstack/database/**"
      - "ai-nav-fullstack/frontend/**"
      - "ai-nav-fullstack/scripts/**"
      - "ai-nav-fullstack/tests/**"
      - ".github/workflows/ai-nav-foundation-ci.yml"
  push:
    branches: [main]
    paths:
      - "ai-nav-fullstack/backend/**"
      - "ai-nav-fullstack/database/**"
      - "ai-nav-fullstack/frontend/**"
      - "ai-nav-fullstack/scripts/**"
      - "ai-nav-fullstack/tests/**"
      - ".github/workflows/ai-nav-foundation-ci.yml"

concurrency:
  group: ai-nav-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-foundation:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-nav-fullstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-nav-fullstack/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt
      - name: Verify non-Agent foundation
        shell: pwsh
        run: .\scripts\verify-foundation.ps1
