limit_req_zone $binary_remote_addr zone=starchart_guest:10m rate=10r/m;

upstream legacy_ai_nav {
    server 127.0.0.1:8000;
    keepalive 8;
}

upstream starchart_http_test {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /chat {
        proxy_pass http://legacy_ai_nav;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://legacy_ai_nav;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /chat-widget.js {
        alias /opt/ai-nav2/chat-widget.js;
        default_type application/javascript;
    }

    location = /old-ai-nav {
        return 308 /old-ai-nav/;
    }

    location /old-ai-nav/ {
        alias /opt/ai-nav2/;
        try_files $uri $uri/ /old-ai-nav/index.html;
    }

    location = /StarChart-AI {
        return 308 /StarChart-AI/;
    }

    location = /StarChart-AI/api/v1/agent/guest/chat {
        limit_req zone=starchart_guest burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /StarChart-AI;
        proxy_pass http://starchart_http_test/api/v1/agent/guest/chat;
    }

    location /StarChart-AI/ {
        add_header Cache-Control "no-cache" always;
        client_max_body_size 3m;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /StarChart-AI;
        proxy_pass http://starchart_http_test/;
    }

    location / {
        root /var/www/project-hub;
        try_files $uri $uri/ /index.html;
    }
}
