<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 项目入口</title>
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body>
    <main class="hub">
      <header>
        <p class="eyebrow">项目选择</p>
        <h1>AI 项目入口</h1>
        <p>请选择要访问的项目。现有服务与新测试项目相互隔离。</p>
      </header>
      <section class="projects" aria-label="项目列表">
        <a class="project-card" href="./old-ai-nav/">
          <span class="badge">稳定入口</span>
          <h2>旧项目</h2>
          <p>继续访问现有 AI 知识导航与聊天功能。</p>
          <span class="action">进入旧项目 →</span>
        </a>
        <a class="project-card project-card--new" href="./StarChart-AI/">
          <span class="badge">HTTP 测试</span>
          <h2>StarChart-AI</h2>
          <p>体验隔离的全栈测试环境与确定性游客助手。</p>
          <span class="action">进入 StarChart-AI →</span>
        </a>
      </section>
    </main>
  </body>
</html>
