limit_req_zone $binary_remote_addr zone=starchart_prod_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=starchart_prod_agent:10m rate=20r/m;

upstream starchart_production {
    server 127.0.0.1:8003;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name starchart-ai.xyz www.starchart-ai.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://starchart-ai.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.starchart-ai.xyz;

    ssl_certificate /etc/letsencrypt/live/starchart-ai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starchart-ai.xyz/privkey.pem;
    return 308 https://starchart-ai.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name starchart-ai.xyz;

    ssl_certificate /etc/letsencrypt/live/starchart-ai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starchart-ai.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:starchart_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 3m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/v1/auth/login {
        limit_req zone=starchart_prod_auth burst=5 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://starchart_production;
    }

    location = /api/v1/auth/register {
        limit_req zone=starchart_prod_auth burst=3 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://starchart_production;
    }

    location = /api/v1/agent/chat {
        limit_req zone=starchart_prod_agent burst=8 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
        proxy_pass http://starchart_production;
    }

    location = /api/v1/agent/chat/stream {
        limit_req zone=starchart_prod_agent burst=8 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        proxy_pass http://starchart_production;
    }

    location / {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_pass http://starchart_production;
    }
}
